name: 週次テクノロジーニュースレポート自動生成

on:
  schedule:
    # 毎週土曜日 12:00 JST = 03:00 UTC
    - cron: '0 3 * * 6'
  workflow_dispatch:
    # 手動トリガーも可能

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install --upgrade pip
          pip install anthropic feedparser pytz requests

      - name: 週次レポートを生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly_tech_news.py

      - name: レポートをコミット・プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          git diff --staged --quiet || git commit -m "週次テクノロジーニュースレポート $(date +'%Y-%m-%d') を追加"
          git push
